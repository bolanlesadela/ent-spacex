<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Space X</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

      <h1 class="h3 fw-bold text-center mb-4">Space X</h1>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h2 class="h4 fw-semibold mb-1">Log in</h2>
          <p class="text-secondary mb-4">Enter your details to continue.</p>

          <form action="#" method="post">
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control form-control-lg" id="email" name="email"
                     placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control form-control-lg" id="password" name="password"
                     placeholder="Enter your password" minlength="8" autocomplete="current-password" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
              <a href="#" class="small">Forgot password?</a>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-dark btn-lg">Log in</button>
            </div>
          </form>
        </div>
      </div>

      <p class="text-center text-secondary mt-4 mb-0">
        Don't have an account? <a href="#">Sign up</a>
      </p>
    </div>
  </main>

</body>
</html>
